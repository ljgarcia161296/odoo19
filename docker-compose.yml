services:
  db:
    image: postgres:16
    container_name: odoo19_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: 4uK90awgBFDtgXT2FQKrAEwb
    volumes:
      - odoo19_db_data:/var/lib/postgresql/data
  odoo:
    image: odoo:19.0
    container_name: odoo19_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8070:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - odoo19_web_data:/var/lib/odoo
volumes:
  odoo19_db_data:
  odoo19_web_data: